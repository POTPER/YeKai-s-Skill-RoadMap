<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的工具箱</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding: 40px 20px;
        }

        header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .category {
            margin-bottom: 40px;
        }

        .category-title {
            font-size: 1.8rem;
            color: white;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid rgba(255, 255, 255, 0.3);
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
        }

        .tool-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .tool-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .tool-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }

        .tool-header {
            margin-bottom: 20px;
        }

        .tool-name {
            font-size: 1.8rem;
            color: #667eea;
            margin-bottom: 5px;
        }

        .tool-subtitle {
            font-size: 1rem;
            color: #888;
            margin-bottom: 15px;
        }

        .tool-link {
            display: inline-block;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .tool-link:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .tool-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .download-btn {
            display: inline-block;
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .download-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4);
        }

        .download-btn svg {
            width: 16px;
            height: 16px;
            margin-right: 5px;
            vertical-align: middle;
        }

        .tool-description {
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .features {
            list-style: none;
        }

        .features li {
            padding: 8px 0;
            padding-left: 25px;
            position: relative;
            color: #555;
            font-size: 0.95rem;
        }

        .features li::before {
            content: '✓';
            position: absolute;
            left: 0;
            color: #667eea;
            font-weight: bold;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 20px;
        }

        .tag {
            background: #f0f0f0;
            color: #667eea;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .add-tool {
            background: rgba(255, 255, 255, 0.2);
            border: 2px dashed rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .add-tool:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.8);
        }

        .add-tool-text {
            font-size: 3rem;
            color: white;
            opacity: 0.7;
        }

        footer {
            text-align: center;
            color: white;
            margin-top: 60px;
            padding: 20px;
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 2rem;
            }

            .tools-grid {
                grid-template-columns: 1fr;
            }

            .tool-card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧰 我的工具箱</h1>
            <p>记录日常使用的实用工具及资源</p>
        </header>

        <div class="category">
            <h2 class="category-title">🎨 图像查看工具</h2>
            <div class="tools-grid">
                <div class="tool-card">
                    <div class="tool-header">
                        <h3 class="tool-name">qView</h3>
                        <p class="tool-subtitle">极简图像查看器</p>
                        <div class="tool-buttons">
                            <a href="https://interversehq.com/qview/" target="_blank" class="tool-link">
                                访问官网 →
                            </a>
                            <a href="https://github.com/jurplel/qView/releases" target="_blank" class="download-btn">
                                <svg viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                                </svg>
                                下载 qView
                            </a>
                        </div>
                    </div>

                    <div class="tool-description">
                        qView 是一款从设计之初就追求视觉极简和空间效率的图像查看器。没有杂乱的界面，只有你的图片和标题栏。
                    </div>

                    <ul class="features">
                        <li>界面极简，无干扰的纯粹空间</li>
                        <li>快速轻量，几乎瞬间打开</li>
                        <li>支持动画GIF控制</li>
                        <li>文件历史记录</li>
                        <li>图像旋转/镜像功能</li>
                        <li>多线程预加载</li>
                        <li>低内存和CPU占用</li>
                    </ul>

                    <div class="tags">
                        <span class="tag">免费开源</span>
                        <span class="tag">跨平台</span>
                        <span class="tag">Qt5</span>
                        <span class="tag">GPLv3</span>
                    </div>
                </div>

                <div class="tool-card add-tool" onclick="alert('点击此处添加新工具！\n\n你可以编辑 index.html 文件来添加更多工具。')">
                    <div class="add-tool-text">+</div>
                </div>
            </div>
        </div>
